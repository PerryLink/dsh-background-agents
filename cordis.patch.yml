# dsh-background-agents bundle patch: mount the interactive background-agent
# plugin (five tools + the backgroundAgents session projection + the Web UI
# sidebar panel). Configure the provider and lifecycle policy per profile by
# overriding the `background-agents` row.
#
# Install (lib/ is committed, so no build step or allowBuilds is needed):
#   dsh plugin --profile <name> add "github:PerryLink/dsh-background-agents#v0.3.0"
- insert:
    - id: background-agents
      name: dsh-background-agents
      config:
        provider: spawn
