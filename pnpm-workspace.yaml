packages:
  - .
allowBuilds:
  esbuild: true

# The dev/test pins ride the 0.1.7-alpha.1 line, and the self-referential rows
# are load-bearing: pnpm matches a prerelease range only against its own
# [major, minor, patch] tuple, so a transitive peer asking for
# `^0.1.7-alpha.1` would otherwise resolve SEPARATELY from this package's own
# `0.1.7-alpha.1` devDeps. That installs a second copy of the host type graph,
# and this package's `UserMessage`/`ContentBlock` then disagree with the host's
# `Agent` (surfacing as spurious `X incorrectly extends Y` errors). Mirroring
# each devDep pin keeps exactly one copy of every host package.
#
# `cordis`, `cosmokit`, and `schemastery` carry explicit floors because the
# 0.1.7 line needs them: `Volatile` is only exported from cordis 4.0.3+
# (re-exported from cosmokit 1.8.4+), and schemastery 3.18.3 is the copy the
# alpha.1 host packages were built against. The nominal ranges (`^4.0.2` /
# `^3.18.2`) do cover those versions, but a lockfile that already pinned the
# older patch keeps resolving to it, so the floors are explicit.
overrides:
  '@deepseek-ai/cordis': 4.0.3
  '@deepseek-ai/cosmokit': 1.8.4
  '@deepseek-ai/schemastery': 3.18.3
  '@deepseek-ai/dsh-agent@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-attachment@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-commands@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-llm@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-session@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-session-projection@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-storage@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-storage-domain@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-storage-json@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-subagent@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-tools@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-typert-protocol@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-util-values@^0.1.7-alpha.1': 0.1.7-alpha.1

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.6'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.6'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.6'
  - '@deepseek-ai/dsh-code-runtime@0.1.0-rc.6'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.6'
  - '@deepseek-ai/dsh-scope@0.1.0-rc.6'
  - '@deepseek-ai/dsh-session@0.1.0-rc.6'
  - '@deepseek-ai/dsh-subagent@0.1.0-rc.6'
  - '@deepseek-ai/dsh-system-prompt@0.1.0-rc.6'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.6'
  - '@deepseek-ai/dsh-tools@0.1.0-rc.6'
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.6'
  - '@deepseek-ai/dsh-user-approval@0.1.0-rc.6'
  - '@deepseek-ai/dsh-storage@0.1.0-rc.6'
  - '@deepseek-ai/dsh-storage-domain@0.1.0-rc.6'
  - '@deepseek-ai/dsh-commands@0.1.0-rc.6'
  - '@deepseek-ai/schemastery@3.18.1'
verifyDepsBeforeRun: false
